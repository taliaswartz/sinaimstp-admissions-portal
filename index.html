  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; width: 100%; }
    body { font-family: 'Inter', sans-serif; background: #F5F7FA; color: #1E293B; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }
    .fi { animation: fi 0.3s ease forwards; }
    @keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .rb { transition: all 0.15s; cursor: pointer; border: none; background: none; text-align: left; width: 100%; }
    .rb:hover .ri { background: rgba(255,255,255,0.04) !important; }
    .tb { transition: all 0.15s; cursor: pointer; border: none; background: none; }
    .lb { transition: opacity 0.15s; cursor: pointer; border: none; }
    .lb:hover { opacity: 0.8; }
    .ck { transition: all 0.15s; cursor: pointer; border: none; }
    .ck:hover { transform: scale(1.08); }
  </style>
</head>
<body style="overflow:hidden;">

  <style id="login-style">
    #login-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: #F5F7FA;
      display: flex; align-items: center; justify-content: center;
    }
    #login-screen.hidden { display: none; }
    #login-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(27,45,91,0.12);
      width: 100%; max-width: 420px;
      overflow: hidden;
    }
    #login-top {
      background: #212070;
      padding: 28px 36px 24px;
      position: relative;
    }
    #login-top::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #212070, #06ABEB, #DC298D);
    }
    #login-logo {
      width: 155px; height: auto;
      filter: brightness(0) invert(1); opacity: 0.88;
      display: block; margin-bottom: 14px;
    }
    #login-top-title {
      font-family: Georgia, serif;
      font-size: 13px; font-weight: 700;
      color: rgba(255,255,255,0.85); letter-spacing: -0.01em;
    }
    #login-top-sub {
      font-size: 10.5px; color: rgba(255,255,255,0.35);
      margin-top: 3px;
    }
    #login-body { padding: 32px 36px 34px; }
    #login-headline {
      font-family: Georgia, serif;
      font-size: 22px; font-weight: 700;
      color: #0F172A; letter-spacing: -0.03em; margin-bottom: 5px;
    }
    #login-desc {
      font-size: 13px; color: #94A3B8;
      margin-bottom: 26px; line-height: 1.6;
    }
    #login-label {
      display: block; font-size: 10.5px; font-weight: 600;
      color: #64748B; letter-spacing: 0.07em;
      text-transform: uppercase; margin-bottom: 7px;
    }
    #login-input {
      width: 100%; padding: 11px 14px;
      border-radius: 8px; border: 1.5px solid #E2E8F0;
      background: #F8FAFC; color: #0F172A; font-size: 14px;
      font-family: 'Inter', sans-serif; outline: none;
      margin-bottom: 12px; box-sizing: border-box;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #login-input:focus {
      border-color: #06ABEB; background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(6,171,235,0.1);
    }
    #login-input::placeholder { color: #CBD5E1; }
    #login-btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #212070; color: #FFFFFF;
      font-size: 13.5px; font-weight: 600;
      font-family: 'Inter', sans-serif; cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    #login-btn:hover { background: #06ABEB; transform: translateY(-1px); }
    #login-btn:active { transform: translateY(0); }
    #login-error { font-size: 12px; color: #EF4444; margin-top: 10px; min-height: 16px; }
    #login-footer { font-size: 11px; color: #CBD5E1; margin-top: 20px; line-height: 1.6; text-align: center; }
    #login-footer a { color: #06ABEB; text-decoration: none; }
  </style>

  <script>
    const PASS = "mstpadmit2026";

    function unlock() {
      const s = document.getElementById("login-screen");
      if (s) s.classList.add("hidden");
    }

    function tryLogin() {
      const input = document.getElementById("login-input");
      const err   = document.getElementById("login-error");
      const btn   = document.getElementById("login-btn");
      if (!input) return;
      const val = input.value.trim();
      if (!val) return;
      if (val === PASS) {
        try { sessionStorage.setItem("mstp_auth", "1"); } catch(e) {}
        unlock();
      } else {
        if (err) err.textContent = "Incorrect password. Please try again.";
        if (input) { input.value = ""; input.focus(); }
        if (btn) btn.textContent = "Enter portal";
        setTimeout(() => { if (err) err.textContent = ""; }, 3000);
      }
    }

    document.addEventListener("DOMContentLoaded", function() {
      const btn   = document.getElementById("login-btn");
      const input = document.getElementById("login-input");
      if (btn)   btn.addEventListener("click", tryLogin);

        <Sec title="Review the full application"><BList items={SCREEN_APP} dot="#06ABEB"/></Sec>
        <Sec title="Secondary application — field reference">
          <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E2E8F0",marginBottom:8}}>
            {[
              {section:"Biographical & other info", fields:["Emergency contact","Previous application to ISMMS or other schools (year, interview, elaboration)","First-generation college student","Post-baccalaureate or special master's program","Graduate degree by matriculation","Activities if not full-time student","Gaps in time","Criminal proceedings","Adverse circumstances in premedical journey (COVID-19 etc.)","Educational pipeline/enrichment programs (C-Step, Gates, MARC, Posse, Questbridge, RISE, McNair, YES, etc.)","Selective fellowships (Boren, Fulbright, Gates Cambridge, Marshall, Rhodes, Schwarzman, Truman, Watson, etc.)"]},
              {section:"Mount Sinai connection", fields:["Currently or previously employed at Mount Sinai","Previous ISMMS coursework (medical or graduate school)","Previously enrolled in ISMMS Graduate School","ISMSS-sponsored programs (SURP, PREP, MedStart, MiNDS, CEYE, MedDOCS, MedStart, etc.)"]},
              {section:"Military service", fields:["US or foreign military service","Adverse conduct violations"]},
              {section:"Research profile", fields:["1–3 sentence research interest summary (100 words)","Total research hours since start of undergraduate training","Publications and presentations (citations)","Preferred research areas ranked 1–3: AIET, Cancer Biology, DRS, DMT, GGS, Immunology, Microbiology, Neuroscience","6–8 preferred research mentors (in rank order, no prior mentors)","Generative AI use in application preparation"]},
              {section:"Essays", fields:["Essay 1 — Toughest feedback received; how handled and what learned (250 words)","Essay 2 — Situation perceived as unfair or unjust; how addressed (250 words)","Essay 3 — Why ISMMS MD-PhD Program specifically (250 words)"]},
              {section:"Optional", fields:["Commitment to Community — background not addressed elsewhere; influence on career motivation (150 words, optional)"]},
            ].map((block,bi,barr)=>(
              <div key={bi} style={{borderBottom:bi<barr.length-1?"1px solid #F0F4F8":"none"}}>
                <div style={{padding:"8px 14px 6px",background:"#F8FAFC"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#212070",letterSpacing:"0.06em",textTransform:"uppercase"}}>{block.section}</div>
                </div>
                <div style={{padding:"4px 0 6px"}}>
                  {block.fields.map((f,fi)=>(
                    <div key={fi} style={{display:"flex",gap:8,padding:"4px 14px",alignItems:"flex-start"}}>
                      <div style={{width:4,height:4,borderRadius:"50%",background:"#CBD5E1",flexShrink:0,marginTop:6}}/>
                      <div style={{fontSize:12,color:"#475569",lineHeight:1.5}}>{f}</div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div style={{fontSize:11,color:"#94A3B8",fontStyle:"italic"}}>Reference only — fields shown as they appear in the 2025–26 ISMMS secondary application</div>

        <Sec title="Summarize in narrative format"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}}>{SCREEN_SUMMARY.map((item,i)=><div key={i} style={{padding:"11px 13px",borderRadius:9,background:"#FFFFFF",border:"1px solid #E2E8F0"}}><div style={{fontSize:12,fontWeight:600,color:"#1E293B",marginBottom:3}}>{item.label}</div><div style={{fontSize:11.5,color:"#64748B",lineHeight:1.5}}>{item.desc}</div></div>)}</div></Sec>
        <Sec title="Attributes"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}}>{SCREEN_ATTRS.map((a,i)=><div key={i} style={{padding:"9px 11px",borderRadius:8,background:`${a.c}08`,border:`1px solid ${a.c}25`}}><div style={{fontSize:11.5,fontWeight:600,color:a.c,marginBottom:2}}>{a.l}</div><div style={{fontSize:10.5,color:"#64748B",fontStyle:"italic"}}>{a.s}</div></div>)}<div style={{padding:"9px 11px",borderRadius:8,background:"rgba(239,68,68,0.06)",border:"1px solid rgba(239,68,68,0.2)"}}><div style={{fontSize:11.5,fontWeight:600,color:"#F87171",marginBottom:2}}>Negative attributes</div><div style={{fontSize:10.5,color:"#64748B",fontStyle:"italic",lineHeight:1.4}}><strong>Internal:</strong> Externalizing, Immature, Inflexible, Negative/pessimistic, Over-sharing, Poor coping, Poor insight, Self-righteous/arrogant<br/><strong>Interpersonal:</strong> Avoidant/help-rejecting, Difficulty building community, Difficulty with authority, Difficulty with peers</div></div></div></Sec>
        <Sec title="Hesitations to flag"><BList items={SCREEN_HES} dot="#F87171" small/></Sec>
        <Sec title="Why academics matter — a note on risk">
          <div style={{marginBottom:10,padding:"14px 16px",borderRadius:10,background:"rgba(33,32,112,0.05)",border:"1px solid rgba(33,32,112,0.15)",fontSize:13,color:"#334155",lineHeight:1.75}}>
            We review academic metrics carefully — not because we are looking for the highest scores, but because we have evidence that <strong>lower standardized testing and unresolved academic struggles predict difficulty with USMLE Step 1</strong> and can slow progression through the program. A student who struggles at a critical milestone affects both the individual and the cohort.
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            {[
              {label:"What we are NOT doing",items:["Screening only for the highest GPAs or MCATs","Penalizing applicants from under-resourced institutions","Treating a single early grade as disqualifying","Ignoring the context of opportunity and trajectory"],bad:true},
              {label:"What we ARE doing",items:["Identifying candidates where academic metrics signal meaningful risk","Using attributes to assess whether resilience, self-awareness, and help-seeking are present","Evaluating trajectory — does improvement signal growth?","Asking: if this person hits a hard exam, do they have what it takes to recover?"],bad:false},
            ].map((col,i)=>(
              <div key={i} style={{padding:"12px 14px",borderRadius:9,background:col.bad?"rgba(239,68,68,0.04)":"rgba(0,135,90,0.04)",border:`1px solid ${col.bad?"rgba(239,68,68,0.2)":"rgba(0,135,90,0.2)"}`}}>
                <div style={{fontSize:10,fontWeight:700,color:col.bad?"#EF4444":"#00875A",letterSpacing:"0.07em",textTransform:"uppercase",marginBottom:8}}>{col.label}</div>
                {col.items.map((item,j)=>(
                  <div key={j} style={{display:"flex",gap:7,alignItems:"flex-start",marginBottom:5}}>
                    <span style={{fontSize:11,color:col.bad?"#EF4444":"#00875A",fontWeight:700,flexShrink:0,marginTop:1}}>{col.bad?"✕":"✓"}</span>
                    <span style={{fontSize:12,color:"#475569",lineHeight:1.5}}>{item}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
          <div style={{padding:"11px 14px",borderRadius:9,background:"rgba(220,41,141,0.05)",border:"1px solid rgba(220,41,141,0.2)",fontSize:12.5,color:"#64748B",lineHeight:1.7}}>
            <strong style={{color:"#DC298D"}}>The key question:</strong> When you see academic risk, look at the full picture. Do the attributes — resilience, self-awareness, willingness to seek help, growth after setback — suggest this person can navigate it? Risk plus strong attributes may be acceptable. Risk plus negative attributes is a serious concern.
          </div>
        </Sec>
        <Sec title="Scoring"><div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>{["Outstanding","Very good","Good","Fair"].map((r,i)=><div key={i} style={{padding:"5px 12px",borderRadius:20,fontSize:12,fontWeight:500,background:`${scCols[i]}15`,border:`1px solid ${scCols[i]}35`,color:scCols[i]}}>{r}</div>)}</div><div style={{fontSize:11,color:"#94A3B8",marginBottom:14}}>Apply to: Research · Clinical · Academics · Leadership · Motivation</div><div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Final disposition</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{SCREEN_DISP.map((s,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 13px",borderRadius:8,background:"#FFFFFF",border:`1px solid ${s.c}25`}}><div style={{width:10,height:10,borderRadius:"50%",background:s.c,flexShrink:0}}/><div style={{fontSize:13,color:s.c,fontWeight:500,flex:1}}>{s.l}</div>{s.note&&<div style={{fontSize:10.5,color:"#94A3B8",fontStyle:"italic"}}>{s.note}</div>}</div>)}</div></Sec>
        <Rems items={SCREEN_REM}/>
      </div>;

    function ResearchGuide() {
      return <div>
        <div style={{marginBottom:20,padding:"15px",borderRadius:10,background:"rgba(33,32,112,0.06)",border:"1px solid rgba(33,32,112,0.18)"}}><div style={{fontSize:10,fontWeight:600,color:"#212070",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:7}}>Purpose</div><div style={{fontSize:13,color:"#64748B",lineHeight:1.7}}>Assess the depth, independence, and authenticity of the applicant's research experience — and evaluate their motivation, intellectual curiosity, and alignment with Mount Sinai's research environment.</div></div>
        <Sec title="Before the interview"><BList items={["Review the full application, paying close attention to research experiences and stated interests","Review the faculty mentor list and any cited publications","Note any flags or gaps raised by screeners related to research depth or independence"]} dot="#212070"/></Sec>
        <Sec title="Focus areas"><div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:8}}>{[{label:"Research experience",desc:"Depth, independence, technical skills"},{label:"Research motivation",desc:"Curiosity, resilience, drive to discover"},{label:"Intellectual engagement",desc:"Ownership of project vs. executing tasks"},{label:"Mount Sinai alignment",desc:"Interests fit our research environment and programs"},{label:"Adaptability",desc:"Critical thinking, problem-solving, comfort with uncertainty"},{label:"Strong MD-PhD potential",desc:"Would thrive in a rigorous research environment"}].map((item,i)=><div key={i} style={{padding:"11px 13px",borderRadius:9,background:"#FFFFFF",border:"1px solid #E2E8F0"}}><div style={{fontSize:12,fontWeight:600,color:"#1E293B",marginBottom:3}}>{item.label}</div><div style={{fontSize:11.5,color:"#64748B",lineHeight:1.5}}>{item.desc}</div></div>)}</div></Sec>
        <Sec title="Key questions to consider"><div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E2E8F0"}}>{["Tell me about your research projects and your specific role.","What challenges did you face and how did you overcome them?","How do you see your research interests evolving during PhD training?","What excites you most about the research environment at Mount Sinai?","Tell me about a moment when an experiment failed. What did you do?","What question in your field do you most want to answer — and why?"].map((q,i,arr)=><div key={i} style={{display:"flex",gap:12,padding:"10px 16px",background:i%2===0?"#FFFFFF":"#F8FAFC",borderBottom:i<arr.length-1?"1px solid #F0F4F8":"none",alignItems:"flex-start"}}><div style={{fontSize:10,fontWeight:700,color:"#212070",minWidth:22,marginTop:2}}>Q{i+1}</div><div style={{fontSize:12.5,color:"#64748B",lineHeight:1.6,fontStyle:"italic"}}>{q}</div></div>)}</div></Sec>
        <Sec title="Final rating — for each domain (Strongly Agree / Agree / Neutral / Disagree / Strongly Disagree)"><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{["Strongly Agree","Agree","Neutral","Disagree","Strongly Disagree"].map((r,i)=>{const cols=["#06ABEB","#5DC8F0","#94A3B8","#F87171","#EF4444"];return <div key={i} style={{padding:"6px 13px",borderRadius:20,fontSize:12,fontWeight:500,background:`${cols[i]}15`,border:`1px solid ${cols[i]}35`,color:cols[i]}}>{r}</div>})}</div></Sec>
        <Rems items={["Focus on depth of understanding and curiosity — not just technical skills or publications.","Maintain objectivity and confidentiality throughout and after the interview.","Provide specific, evidence-based comments on strengths and areas of concern.","Your interview is unscored — but your qualitative impressions are genuinely valued."]}/>
      </div>;
    }

    function CommitteeGuide({allMeetings}) {
      return <div>

                                  <div style={{width:26,height:26,borderRadius:7,background:"rgba(6,171,235,0.12)",border:"1px solid rgba(6,171,235,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#06ABEB"}}>{w.n}</div>
                                  <div style={{fontSize:12,color:"#64748B",display:"flex",alignItems:"center",gap:4}}><span>🍽️</span>{w.sun}</div>
                                  <div style={{fontSize:12.5,color:"#475569"}}>{w.mon}</div>
                                  <div style={{fontSize:12.5,color:"#475569"}}>{w.tue}</div>
                                  <div style={{display:"flex",alignItems:"center",gap:5}}>
                                    <span style={{fontSize:12.5,color:"#475569"}}>{w.adcom} · {w.flag?<><span style={{fontWeight:700,color:"#B45309"}}>{w.time}</span></>:w.time}</span>
                                    {w.flag&&<span style={{fontSize:9.5,padding:"2px 6px",borderRadius:8,background:"rgba(251,191,36,0.15)",color:"#B45309",border:"1px solid rgba(251,191,36,0.3)",fontWeight:600}}>⚑ 1hr later</span>}
                                  </div>
                                </div>
                              ))}
                            </div>
                            <div style={{marginTop:8,fontSize:11,color:"#94A3B8",padding:"9px 13px",borderRadius:8,background:"rgba(33,32,112,0.06)",border:"1px solid rgba(33,32,112,0.15)"}}>💡 All applicants attend Monday morning together — welcome session (10–11 am) and student panel (11 am–noon) — regardless of interview day. Each applicant meets with 2 admissions committee members, 1 student interviewer, and 1 research interviewer.</div>
                          </div>
                          <div>
                            <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Daily schedule</div>
                            <div style={{display:"flex",gap:6,marginBottom:10}}>
                              {["mon","tue"].map(d=><button key={d} className="tb" onClick={()=>setDay(d)} style={{padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:500,background:day===d?"rgba(6,171,235,0.1)":"#FFFFFF",border:day===d?"1px solid rgba(6,171,235,0.3)":"1px solid #E2E8F0",color:day===d?"#06ABEB":"#64748B"}}>{d==="mon"?"Monday":"Tuesday"}</button>)}
                            </div>
                            <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E2E8F0"}}>
                              {(day==="mon"?MON_SCHED:TUE_SCHED).map((s,i,arr)=>{
                                const dc=s.type==="info"?"#212070":s.type==="int"?"#06ABEB":"#DC298D";
                                return <div key={i} style={{display:"flex",alignItems:"flex-start",gap:11,padding:"10px 15px",background:i%2===0?"#FFFFFF":"#F8FAFC",borderBottom:i<arr.length-1?"1px solid #F0F4F8":"none"}}>
                                  <div style={{minWidth:105,fontSize:11,color:"#94A3B8",paddingTop:1}}>{s.time}</div>
                                  <div style={{display:"flex",alignItems:"center",gap:6,flex:1,paddingTop:1}}>
                                    <div style={{width:5,height:5,borderRadius:"50%",background:dc,flexShrink:0}}/>
                                    <div><div style={{fontSize:12.5,color:"#1E293B",fontWeight:500}}>{s.event}</div>{s.note&&<div style={{fontSize:10.5,color:"#94A3B8",marginTop:1}}>{s.note}</div>}</div>
                                  </div>
                                </div>;
                              })}
                            </div>
                          </div>
                        </>}
                        {isRecP&&<>
                        <div style={{marginBottom:20}}>
                          <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Interview weeks</div>
                          <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E2E8F0"}}>
                            <div style={{display:"grid",gridTemplateColumns:"44px 100px 1fr 1fr",background:"#F1F5F9",padding:"9px 15px",borderBottom:"1px solid #E2E8F0"}}>
                              {["Wk","Sunday (dinner)","Monday","Tuesday"].map(h=><div key={h} style={{fontSize:9.5,fontWeight:600,color:"#94A3B8",letterSpacing:"0.06em",textTransform:"uppercase"}}>{h}</div>)}
                            </div>
                            {WEEKS.map((w,i)=><div key={i} style={{display:"grid",gridTemplateColumns:"44px 100px 1fr 1fr",padding:"11px 15px",borderBottom:i<3?"1px solid #F0F4F8":"none",alignItems:"center",background:i%2===0?"#FFFFFF":"#F8FAFC"}}><div style={{width:26,height:26,borderRadius:7,background:"rgba(6,171,235,0.12)",border:"1px solid rgba(6,171,235,0.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:"#06ABEB"}}>{w.n}</div><div style={{fontSize:12,color:"#64748B",display:"flex",alignItems:"center",gap:4}}><span>🍽️</span>{w.sun}</div><div style={{fontSize:12.5,color:"#475569"}}>{w.mon}</div><div style={{fontSize:12.5,color:"#475569"}}>{w.tue}</div></div>)}
                          </div>
                        </div>
                        <div style={{marginBottom:20}}>
                          <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Daily schedule</div>
                          <div style={{display:"flex",gap:6,marginBottom:10}}>{["mon","tue"].map(d=><button key={d} className="tb" onClick={()=>setDay(d)} style={{padding:"6px 14px",borderRadius:8,fontSize:12,fontWeight:500,background:day===d?"rgba(6,171,235,0.15)":"rgba(0,0,0,0.04)",border:day===d?"1px solid rgba(6,171,235,0.35)":"1px solid #E2E8F0",color:day===d?"#06ABEB":"#64748B",cursor:"pointer"}}>{d==="mon"?"Monday":"Tuesday"}</button>)}</div>
                          <div style={{borderRadius:10,overflow:"hidden",border:"1px solid #E2E8F0"}}>{(day==="mon"?MON_SCHED:TUE_SCHED).map((s,i,arr)=>{const dc=s.type==="info"?"#212070":s.type==="int"?"#06ABEB":"#DC298D";return <div key={i} style={{display:"flex",alignItems:"flex-start",gap:11,padding:"10px 15px",background:i%2===0?"#FFFFFF":"#F8FAFC",borderBottom:i<arr.length-1?"1px solid #F0F4F8":"none"}}><div style={{minWidth:105,fontSize:11,color:"#94A3B8",paddingTop:1}}>{s.time}</div><div style={{display:"flex",alignItems:"center",gap:6,flex:1,paddingTop:1}}><div style={{width:5,height:5,borderRadius:"50%",background:dc,flexShrink:0}}></div><div><div style={{fontSize:12.5,color:"#1E293B",fontWeight:500}}>{s.event}</div>{s.note&&<div style={{fontSize:10.5,color:"#94A3B8",marginTop:1}}>{s.note}</div>}</div></div></div>;})}</div>
                        </div>
                        <div>
                          <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Upcoming recruitment events</div>
                          {[{name:"SACNAS",dates:"Oct 29–31",location:"Long Beach, CA",icon:"🌟"},{name:"ABRCMS",dates:"Nov 18–21",location:"Seattle, WA",icon:"🌟"},{name:"Virtual recruitment events",dates:"TBD",location:"Virtual",icon:"💻"},{name:"On-campus recruitment events",dates:"TBD",location:"Mount Sinai",icon:"🏥"}].map((ev,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:11,padding:"11px 15px",borderBottom:i<3?"1px solid #F0F4F8":"none",background:"#FFFFFF"}}><span style={{fontSize:18}}>{ev.icon}</span><div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{ev.name}</div><div style={{fontSize:11.5,color:"#64748B"}}>{ev.dates} · {ev.location}</div></div></div>)}
                        </div>
                      </>}
                      </div>
                    )}

                    {tab==="platform"&&(
                      <div>
                        <div style={{marginBottom:18,padding:"15px",borderRadius:10,background:"rgba(6,171,235,0.06)",border:"1px solid rgba(6,171,235,0.2)"}}>
                          <div style={{fontSize:13,fontWeight:600,color:"#06ABEB",marginBottom:4}}>ZAP — Admissions Platform</div>
                          <div style={{fontSize:12.5,color:"#64748B",lineHeight:1.6,marginBottom:10}}>Log in at <span style={{color:"#06ABEB",fontWeight:500}}>applymd.mssm.edu</span> using your Sinai email and network password. Click "Faculty Login."</div>
                          <a href="https://applymd.mssm.edu" target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,padding:"7px 13px",borderRadius:8,background:"rgba(6,171,235,0.12)",border:"1px solid rgba(6,171,235,0.3)",color:"#06ABEB",fontSize:12,fontWeight:600,textDecoration:"none"}}>Open applymd.mssm.edu ↗</a>
                        </div>
                        {[role.canScreen&&{icon:"🔍",title:"Screening",color:"#06ABEB",steps:["Click 'Screen' in the left navigation","List defaults to All Applicants Not Screened","Click View to open the application and screening form","Complete the form and Submit at the bottom of the page"]},{icon:"🗣️",title:"Interviewing",color:"#212070",steps:["Click 'MD-PhD Interview' in the left navigation","List defaults to To Do","Click View to open the application and interview form","Submit button appears at both top and bottom of the page"]},role.canVote&&{icon:"🗳️",title:"Committee meeting",color:"#4B6FBF",steps:["Click 'Committee List' in the left navigation","Navigate to the meeting date on the calendar","Click an applicant name to open the committee voting form","Select your vote and click Submit — do NOT check the Admissions Office Review box"]}].filter(Boolean).map((sec,i)=>(
                          <div key={i} style={{marginBottom:10,padding:"15px",borderRadius:10,background:"#FFFFFF",border:"1px solid #E2E8F0"}}>
                            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:15}}>{sec.icon}</span><div style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{sec.title}</div></div>
                            <ol style={{paddingLeft:0,listStyle:"none",display:"flex",flexDirection:"column",gap:5}}>
                              {sec.steps.map((step,j)=><li key={j} style={{display:"flex",gap:9,alignItems:"flex-start"}}><div style={{width:17,height:17,borderRadius:5,background:`${sec.color}15`,border:`1px solid ${sec.color}30`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:9.5,fontWeight:700,color:sec.color,marginTop:1}}>{j+1}</div><span style={{fontSize:12,color:"#64748B",lineHeight:1.6}}>{step}</span></li>)}
                            </ol>
                          </div>
                        ))}
                      </div>
                    )}

                    {tab==="resources"&&(
                      <div>
                        <div style={{marginBottom:24}}><div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>About the program</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{PROGRAM_LINKS.map((r,i)=><ResCard key={i} r={r} accent={gc.accent}/>)}</div></div>
                        {!isResI&&<div style={{marginBottom:24}}><div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Committee resources</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{COMMITTEE_RESOURCES.map((r,i)=><ResCard key={i} r={r} accent={gc.accent}/>)}</div></div>}
                        {!isResI&&<div><div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>Compliance</div><div style={{display:"flex",flexDirection:"column",gap:6}}>{COMPLIANCE.map((r,i)=><ResCard key={i} r={r} accent={gc.accent}/>)}</div></div>}
                      </div>
                    )}

                    {tab==="contacts"&&(
                      <div>
                        <div style={{fontSize:10,fontWeight:600,color:"#94A3B8",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:10}}>MSTP leadership team</div>
                        <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:18}}>
                          {CONTACTS.map((person,i)=>(
                            <div key={i} style={{display:"flex",alignItems:"center",gap:13,padding:"13px 15px",borderRadius:10,background:"#FFFFFF",border:"1px solid #E2E8F0"}}>
                              <div style={{width:38,height:38,borderRadius:11,background:`${person.color}15`,border:`1px solid ${person.color}28`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:12,fontWeight:700,color:person.color,fontFamily:"Georgia,serif"}}>{person.initials}</div>
                              <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600,color:"#1E293B",marginBottom:1}}>{person.name}</div><div style={{fontSize:11.5,color:"#64748B"}}>{person.role}</div></div>
                              <a href={"mailto:"+person.email} style={{fontSize:16,color:"#94A3B8",padding:"5px 9px",borderRadius:6,background:"#F8FAFC",border:"1px solid #E2E8F0",textDecoration:"none"}}>✉</a>
                            </div>
                          ))}
                        </div>
                        {!isRecP&&<div style={{padding:"13px 15px",borderRadius:10,background:"#FFFFFF",border:"1px solid #E2E8F0",fontSize:12,color:"#64748B",lineHeight:1.7}}>For COI disclosures, contact Bianca Taylor directly. For general process questions, reach out to MSTP leadership. All applicant information is strictly confidential — do not discuss outside the admissions process.</div>}
                      </div>
                    )}

                  </div>
                </div>
              </>
            )}
          </div>
          {/* ── MOBILE BOTTOM NAV ── */}
          {isMobile&&(
            <div style={{background:"#FFFFFF",borderTop:"1px solid #E2E8F0",display:"flex",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom, 0px)"}}>
              {[
                {icon:"📚",label:"Resources",action:()=>{setShowResources(true);setShowTimeline(false);setShowMobileMenu(false);},active:showResources},
                {icon:"📅",label:"Timeline",action:()=>{setShowTimeline(true);setShowResources(false);setShowMobileMenu(false);},active:showTimeline},
              ].map(item=>(
                <button key={item.label} onClick={item.action}
                  style={{flex:1,padding:"10px 6px",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:item.active?"#06ABEB":"#64748B"}}>
                  <span style={{fontSize:20}}>{item.icon}</span>
                  <span style={{fontSize:10,fontWeight:item.active?600:400}}>{item.label}</span>
                </button>
              ))}
              <a href="https://applymd.mssm.edu" target="_blank" rel="noreferrer"
                style={{flex:1,padding:"10px 6px",textDecoration:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#06ABEB"}}>
                <span style={{fontSize:20}}>⚡</span>
                <span style={{fontSize:10}}>ZAP</span>
              </a>
              <a href="https://forms.gle/PqZy5Naxo353msju7" target="_blank" rel="noreferrer"
                style={{flex:1,padding:"10px 6px",textDecoration:"none",display:"flex",flexDirection:"column",alignItems:"center",gap:2,color:"#94A3B8"}}>
                <span style={{fontSize:20}}>📝</span>
                <span style={{fontSize:10}}>Feedback</span>
              </a>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
